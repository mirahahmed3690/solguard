[package]
name = "solguard"
version = "0.1.0"
edition = "2021"
description = "A vendor-neutral policy firewall for Solana AI-agent transactions — decide ALLOW/DENY before signing"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
owo-colors = "4"
